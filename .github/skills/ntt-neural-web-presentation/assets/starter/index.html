<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061525" />
    <meta name="color-scheme" content="dark" />
    <title>Inteligencia conectada | NTT DATA</title>
  </head>
  <body>
    <div id="app" class="app" data-state="overview">
      <canvas id="neural-canvas" aria-hidden="true"></canvas>
      <div class="scene-scrim" aria-hidden="true"></div>

      <header id="hero" class="hero is-visible" aria-labelledby="presentation-title">
        <div class="hero-copy">
          <p id="presentation-eyebrow" class="hero-context">NTT DATA · Presentación interactiva</p>
          <h1 id="presentation-title" tabindex="-1">Inteligencia conectada</h1>
          <p id="presentation-subtitle" class="hero-subtitle">
            Un recorrido por las capacidades que convierten señales, conocimiento y ejecución en impacto.
          </p>
          <button id="start-button" class="start-button" type="button">
            Explorar la red
            <span aria-hidden="true">→</span>
          </button>
          <p id="keyword-summary" class="sr-only"></p>
        </div>
        <div id="keyword-field" class="keyword-field" aria-hidden="true"></div>
      </header>

      <main id="slide-stage" class="slide-stage" aria-live="polite" aria-atomic="false"></main>

      <nav class="deck-controls" aria-label="Controles de la presentación">
        <button id="previous-button" class="control-button" type="button" aria-label="Anterior">
          <span aria-hidden="true">←</span>
        </button>
        <div id="progress-dots" class="progress-dots" role="group" aria-label="Progreso"></div>
        <button id="next-button" class="control-button" type="button" aria-label="Siguiente">
          <span aria-hidden="true">→</span>
        </button>
      </nav>

      <div class="presentation-hint" aria-hidden="true">← → · espacio</div>

      <div class="brand-lockup">
        <img id="brand-logo" src="./brand/ntt-data-logo.svg" alt="NTT DATA" hidden />
        <span id="brand-fallback" class="brand-fallback" aria-label="NTT DATA">NTT DATA</span>
      </div>

      <p id="deck-status" class="sr-only" aria-live="polite"></p>
      <div id="webgl-fallback" class="webgl-fallback" hidden aria-hidden="true"></div>

      <noscript>
        <div class="noscript-message">Esta presentación necesita JavaScript para activar la navegación.</div>
      </noscript>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
